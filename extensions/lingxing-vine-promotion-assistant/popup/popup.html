<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>领星 Vine 推广标注助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 21V11.4"/>
            <path d="M12 13.1c-3.9 0-6.4-2.1-6.4-5.6 3.9 0 6.4 2.1 6.4 5.6Z"/>
            <path d="M12.3 10.9c0-3.9 2.2-6.4 5.7-6.4 0 3.9-2.2 6.4-5.7 6.4Z"/>
            <path d="M8.6 19.2c2.2 1 5.6 1 7.8 0"/>
          </svg>
        </div>
        <div>
          <h1>Vine 推广标注助手</h1>
          <p>v0.1.4 · 双渠道试用版</p>
        </div>
      </header>

      <section class="status-card">
        <span class="status-dot" id="statusDot"></span>
        <div>
          <strong id="statusTitle">正在读取上次检查…</strong>
          <p id="statusDetail">草稿、令牌和买家信息都不会上传。</p>
        </div>
      </section>

      <button class="primary" id="openButton" type="button">
        打开当前页助手
      </button>
      <p class="message" id="message" role="status" aria-live="polite"></p>

      <section class="rules">
        <h2>执行口径</h2>
        <ul>
          <li>只读检查先展示待标订单。</li>
          <li>人工勾选核对后才提交。</li>
          <li>推广类型保持默认。</li>
          <li>提交后逐单回读 <code>isAssessed</code>。</li>
        </ul>
      </section>

      <footer>仅作用于领星 ERP 销售订单列表</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
