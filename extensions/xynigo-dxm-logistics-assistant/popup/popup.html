<body>
  <main>
    <p class="eyebrow">XYNIGO · PHASE 2 BETA</p>
    <h1>店小秘物流助手</h1>
    <p>打开店小秘“订单—待审核”页面，点击右边缘可伸缩的“物流助手”入口。</p>
    <ol>
      <li>普通订单或采购子单可粘贴两列，也可按模板上传。</li>
      <li>拆单模式先按商品图生成 SHEIN 包裹，再回读并映射发货。</li>
      <li>插件在其他店小秘订单页面不会显示或执行。</li>
    </ol>
    <div class="warning">正式订单使用前，请先在测试店用 1–3 单验收。</div>

  </main>
