<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Xynigo 店小秘运营采购助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="popup-logo" src="../icons/icon128.png" alt="">
        <div>
          <h1>店小秘运营采购助手</h1>
          <p id="versionText">本地开发版</p>
        </div>
      </header>

      <div class="dev-notice">
        <strong>Xynigo 统一身份联调</strong>
        <span>正式提交成功后填入一条 XYP2 客服备注，仍由运营人工保存。</span>
      </div>

      <section class="connection-card" id="connectionCard" data-state="loading">
        <div class="connection-head">
          <i class="connection-dot" aria-hidden="true"></i>
          <div>
            <strong id="connectionTitle">正在检查 Xynigo…</strong>
            <span id="connectionDetail">无需运行 Xynigo 本机服务</span>
          </div>
        </div>
        <dl id="identitySummary" hidden>
          <div><dt>当前成员</dt><dd id="identityName">—</dd></div>
          <div><dt>组织</dt><dd id="tenantName">—</dd></div>
          <div><dt>提单权限</dt><dd id="permissionState">—</dd></div>
        </dl>
      </section>

      <div class="popup-actions primary-actions">
        <button id="connectXynigo" type="button" class="primary-action">使用飞书登录</button>
        <button id="refreshStatus" type="button">刷新状态</button>
      </div>

      <section class="record-summary">
        <span>本地脱敏草稿缓存</span>
        <strong id="recordCount">0</strong>
      </section>

      <div class="popup-actions">
        <button id="exportRecords" type="button">导出脱敏缓存</button>
        <button id="clearRecords" type="button" class="danger-action">清除本地缓存</button>
      </div>

      <p class="popup-hint" id="statusText" role="status">插件不保存飞书令牌；Xynigo 短期会话只保留在当前浏览器会话。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
