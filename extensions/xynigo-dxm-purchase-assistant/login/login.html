<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>飞书登录｜Xynigo 运营采购助手</title>
    <link rel="stylesheet" href="login.css">
  </head>
  <body>
    <main>
      <img class="logo" src="../icons/icon128.png" alt="">
      <h1>使用飞书登录</h1>
      <p>飞书密钥和飞书令牌始终留在 Xynigo 云端。短期 Xynigo 会话仅保留在插件后台的当前浏览器会话中，退出浏览器后自动失效。</p>
      <button id="startLogin" type="button">继续飞书登录</button>
      <p id="status" role="status" aria-live="polite">无需启动 Xynigo 本机服务。</p>
    </main>
    <script src="login.js"></script>
  </body>
</html>
