<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>店小秘待审核模拟页</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #eef2f6; }
      .mock-modal { width: 900px; margin: 30px auto; padding: 20px; background: white; }
      .mock-detail-body { position: relative; height: 260px; margin: 16px 0; }
      .mock-header { box-sizing: border-box; height: 30px; padding: 5px; text-align: center; border: 1px solid #ccc; }
      .mock-header button { float: right; }
      .mock-tabs { position: absolute; z-index: 2; top: 30px; left: 0; width: 180px; display: flex; flex-direction: column; }
      .mock-tabs > div { box-sizing: border-box; height: 44px; padding: 10px 16px; border: 1px solid #ccc; }
      .mock-tabs .mock-active { color: white; background: #4092cf; }
      .mock-content { box-sizing: border-box; width: 100%; min-height: 230px; padding: 16px 16px 16px 196px; border: 1px solid #ccc; }
      table { width: 100%; border-collapse: collapse; }
      td, th { padding: 8px; border: 1px solid #ddd; }
      .mock-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .mock-note { position: fixed; inset: 120px 180px auto; padding: 16px; background: white; border: 1px solid #aaa; }
      .mock-note textarea { width: 100%; height: 120px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <section class="mock-modal" role="dialog">
      <h2>包裹「 XMWUDEMO0001 」详情 - 来源于「SHEIN」</h2>
      <p>卖家：墨西哥测试店铺　买家：脱敏客户　包裹总额：MXN 630.00</p>
      <div class="mock-detail-body order-detail-content">
        <div class="mock-header order-detail-content__header">物流信息 <button type="button">编辑</button></div>
        <nav class="mock-tabs order-detail-content__nav">
          <div class="order-detail-content__nav-item">收货地址</div>
          <div class="order-detail-content__nav-item">报关信息</div>
          <div class="order-detail-content__nav-item mock-active">物流信息</div>
          <div class="order-detail-content__nav-item">备注信息</div>
        </nav>
        <section class="mock-content order-detail-content__form">
          <p>买家指定：无</p>
          <p>获取方式：无</p>
          <p>物流方式：请点右上角「编辑」选择物流方式</p>
        </section>
      </div>
      <table>
        <thead><tr><th>订单号</th><th>订单产品</th></tr></thead>
        <tbody>
          <tr><td>GSHDEMO0001</td><td>MX-60874943-8896 x 2　MXN 420.00　60874943：Dark Green-L</td></tr>
          <tr><td>GSH1RA58 x 1</td><td>469433114-10　MXN 210.00　469433114：Maroon-S</td></tr>
        </tbody>
      </table>
      <div class="mock-actions">
        <button type="button" id="nativeAudit">审核</button>
        <button type="button" id="nativeRemark">备注</button>
        <button type="button">关闭</button>
      </div>
    </section>
    <section class="mock-note" role="dialog" hidden>
      <h3>备注信息</h3>
      <textarea aria-label="订单备注"></textarea>
      <button type="button">保存</button>
    </section>
    <script>
      document.getElementById('nativeRemark').addEventListener('click', () => {
        document.querySelector('.mock-note').hidden = false;
      });
    </script>
  </body>
</html>
