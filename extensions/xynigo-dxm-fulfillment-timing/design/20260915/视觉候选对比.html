</style><body id="xft-review"><header class="xft-top"><div class="xft-tag">XYNIGO / 视觉目标确认 / 20260915</div><h1>先选看起来舒服的一版</h1><p>四版使用相同的虚构展示数据与完整模块。先比较留白和比例，再点「原尺寸查看」检查文字；缩略图不用于判断字号。</p><div class="xft-toolbar"><label>模拟 CSS 视口 <select id="xft-size"><option value="1676,960">当前现场 · 1676 × 960</option><option value="1150,800">窄视口 · 1150 × 800</option><option value="975,800">窄视口 · 975 × 800</option><option value="1300,800">窄视口 · 1300 × 800</option></select></label><button id="xft-all">四版并排比较</button><span id="xft-status"></span></div></header><main id="xft-grid" class="xft-grid"></main><footer class="xft-bottom"><p class="xft-note">请反馈：候选 A / B / C / D，以及最在意「面板外侧留白 / 内部内容贴边 / 整体尺度」哪一项。所有候选靠右，高度 80% 视口，底部保留背景。</p><p>现场读数：1676 × 960，DPR=2；现场面板显示 v0.1.8 / 面板缩放100%，工作树基线为 v0.1.6。DPR 不等于浏览器缩放。此文件仅用于视觉选择，未修改扩展；筛选、采集和导出只展示控件，不执行业务操作。维度页签可切换。</p></footer>
<script>

 {id:'B',name:'中等宽度 · 增大外侧留白',w:840,r:56,p:28,font:12,row:8,z:1,desc:'正文不缩小；将更多空间留给面板外围。'},
 {id:'C',name:'窄面板 · 内容更舒展',w:760,r:56,p:28,font:12,row:11,z:1,desc:'行距更宽，纵向滚动更多；用布局消化窄宽度。'},
 {id:'D',name:'中等宽度 · 85% 尺度对照',w:840,r:56,p:28,font:12,row:8,z:.85,desc:'与 B 保持同一外框，仅内部缩到 85%，验证是否接受小一号文字。'}

function table(head,rows){return `<table class="xft-table"><thead><tr>${head.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(s=>`<td>${s}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function panel(o){
const kpis=[['统计单数','130','当前筛选范围内的订单数'],['平均履约时效','120.0 小时','签收时间减下单时间的算术平均值'],['中位数','112.0 小时','履约时效排序后的中间值'],['P90','192.0 小时','90% 的订单履约时效不超过该值'],['≤7天占比','80.0%','达标线为分段第二个阈值']];
const rows=[['备货时效',24,'发货减下单','#4a7dbe'],['揽收时效',36,'揽收减发货；负值保留并红色标出','#e6a23c'],['尾程时效',60,'签收减揽收','#2e9e5b'],['运输时效',84,'签收减上网；与尾程含重叠，不重复计入构成','#67968a'],['履约时效',120,'签收减下单','#1f3a5f']];
return `<aside id="xft-panel"><header class="xft-header"><span class="xft-logo">时</span><b>履约时效统计</b><span class="xft-version">视觉候选 ${o.id}</span><span>×</span></header><div class="xft-body"><div class="xft-source"><b>数据来源：页面接口直读</b><span>当前范围 130 单 · 时效样本 130 单</span><span>口径：北京时间</span><span>揽收时刻：轨迹精确提取</span><button disabled>开始统计</button></div><div class="xft-filters"><label>店铺账号 ${q('模糊匹配店铺账号')}<input placeholder="搜索店铺账号"></label><label>订单 ${q('订单号 / 包裹号 / 运单号；空格、换行、逗号分隔，最多1000个')}<input placeholder="订单号 / 包裹号 / 运单号"></label><label>物流方式<select><option>全部</option><option>iMile</option><option>J&T</option><option>FedEx</option></select></label><label>目标国家<select><option>全部</option><option>墨西哥</option></select></label><label class="xft-range">下单日期<span><input type="date" aria-label="下单开始日期"> ~ <input type="date" aria-label="下单结束日期"></span></label><label class="xft-range">发货日期<span><input type="date" aria-label="发货开始日期"> ~ <input type="date" aria-label="发货结束日期"></span></label><div class="xft-filterfoot"><span>筛选 130 / 130 单</span><button disabled>重置</button></div></div><div class="xft-unit">展示口径 <button class="xft-active">小时</button><button>自然日</button><span>分段阈值（天）</span> ≤ <input type="number" value="5"> / ≤ <input type="number" value="7"> / ≤ <input type="number" value="10"></div><section class="xft-kpis">${kpis.map(k=>`<article><span>${k[0]} ${q(k[2])}</span><strong>${k[1]}</strong></article>`).join('')}</section><h3>分段占比</h3><div class="xft-bar"><span style="width:50%;background:#2e9e5b">50%</span><span style="width:30%;background:#3b82c4">30%</span><span style="width:15%;background:#e6a23c">15%</span><span style="width:5%;background:#e05252"></span></div><div class="xft-legend">≤5天 · 65单　　&gt;5至7天 · 39单　　&gt;7至10天 · 19单　　&gt;10天 · 7单（5%，四舍五入）</div><h3>时效拆解</h3><div class="xft-bar"><span style="width:20%;background:#4a7dbe">20%</span><span style="width:30%;background:#e6a23c">30%</span><span style="width:50%;background:#2e9e5b">50%</span></div><div class="xft-legend">平均履约 120.0小时 = 备货24.0 + 揽收36.0 + 尾程60.0</div>${table(['指标','构成图示','平均(小时)','中位(小时)','P90(小时)','最长(小时)'],rows.map((r,i)=>[r[0]+q(r[2]),`<div class="xft-mini"><i style="width:${r[1]/1.2}%;background:${r[3]}"></i></div>`,r[1].toFixed(1),(r[1]*.9).toFixed(1),(r[1]*1.6).toFixed(1),(r[1]*2.1).toFixed(1)]))}<p class="xft-red">揽收负值示例：−15.9 小时（保留原值；此处为展示样例）</p><nav class="xft-tabs"><button class="xft-active" data-dim="店铺">分店铺</button><button data-dim="物流">分物流方式</button><button data-dim="国家">分国家</button><button data-dim="日期">按下单日</button></nav><div id="xft-dim"></div><h3>订单明细 <small>预览前10单 · 按签收时间倒序</small></h3>${table(['订单号','店铺','物流','下单时间','签收时间','履约(小时)','自然日','分段'],Array.from({length:10},(_,i)=>['DEMO-'+String(i+1).padStart(4,'0'),'演示店铺'+(i%3+1),['iMile','J&T','FedEx'][i%3],'2026-09-01 08:00','2026-09-06 08:00','120.0','5','快速']))}</div><footer class="xft-footer"><span>130 单 · 合成展示数据</span><div><button disabled>导出明细 CSV</button><button disabled>导出当前汇总 CSV</button></div></footer></aside>`;
}
function doc(o){const w=Math.min(o.w,size[0]-o.r-72),h=size[1]*.8;
return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
#xft-scene{margin:0;background:#e8edf3;font:13px/1.5 -apple-system,'PingFang SC',sans-serif;color:#62748a}#xft-scene *{box-sizing:border-box}#xft-scene .xft-bg-nav{height:56px;background:#4b8abd;color:white;padding:16px 28px;font-size:16px}#xft-scene .xft-bg{padding:30px;width:360px}#xft-scene .xft-bg p{padding:12px;background:#f7f9fc;border-bottom:1px solid #dce3ed}#xft-panel{position:fixed;right:${o.r/o.z}px;top:${Math.round(size[1]*.08)/o.z}px;width:${w/o.z}px;height:${h/o.z}px;zoom:${o.z};display:flex;flex-direction:column;border-radius:10px;background:white;box-shadow:0 12px 32px #24364c29;color:#2c3340;font-size:${o.font}px;overflow:hidden}#xft-panel .xft-header{display:flex;align-items:center;gap:12px;background:#1f3a5f;color:white;padding:12px ${o.p}px;flex:none}#xft-panel .xft-header b{font-size:14px}#xft-panel .xft-version{margin-left:auto;font-size:11px;opacity:.7}#xft-panel .xft-logo{background:#2e9e5b;padding:2px 5px;border-radius:4px}#xft-panel .xft-body{padding:18px ${o.p}px 24px;flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable}#xft-panel .xft-source{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;background:#f3f6fa;border:1px solid #e0e7ef;padding:10px 12px;border-radius:7px;margin-bottom:14px;font-size:11px}#xft-panel .xft-filters{display:grid;grid-template-columns:1.4fr 1.6fr 1fr 1fr;gap:10px 12px;padding:12px;background:#f8fafc;border:1px solid #e0e7ef;border-radius:7px;margin-bottom:14px}#xft-panel label{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}#xft-panel label input,#xft-panel label select{width:100%;min-width:0}#xft-panel .xft-range{grid-column:span 2}#xft-panel .xft-range span{display:flex;gap:5px;width:100%;align-items:center}#xft-panel .xft-range input{flex:1;min-width:0}#xft-panel .xft-filterfoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}#xft-panel input,#xft-panel select{height:26px!important;box-sizing:border-box!important;border:1px solid #cbd5e2;border-radius:5px;padding:0 6px;font:inherit;color:inherit;background:white}#xft-panel button{height:28px!important;box-sizing:border-box!important;border:1px solid #cbd5e2;border-radius:5px;padding:0 9px;font:inherit;color:inherit;background:white;cursor:pointer;white-space:nowrap}#xft-panel button:disabled{cursor:default}#xft-panel .xft-active{background:#1f3a5f;color:white;border-color:#1f3a5f}#xft-panel .xft-unit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 16px}#xft-panel .xft-unit input{width:42px}#xft-panel .xft-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 18px}#xft-panel .xft-kpis article{border:1px solid #e0e7ef;border-radius:7px;padding:12px 10px;min-width:0}#xft-panel .xft-kpis article>span{color:#728096;font-size:11px}#xft-panel strong{display:block;font-size:18px;color:#1f3a5f;margin-top:6px;overflow-wrap:anywhere}#xft-panel .xft-q{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;font-size:10px;background:#a7b4c5;color:white;cursor:help;vertical-align:middle}#xft-panel h3{font-size:13px;margin:18px 0 10px}#xft-panel small{font-size:11px;font-weight:400;color:#728096}#xft-panel .xft-bar{display:flex;height:24px;border-radius:5px;overflow:hidden}#xft-panel .xft-bar span{display:flex;align-items:center;justify-content:center;color:white;font-size:11px}#xft-panel .xft-legend{font-size:11px;color:#687a90;margin:8px 0 14px;line-height:1.8}#xft-panel .xft-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:10px 0 18px}#xft-panel .xft-table th,#xft-panel .xft-table td{text-align:right;padding:${o.row}px 7px;border-bottom:1px solid #e7edf3;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;font-size:11px;vertical-align:middle}#xft-panel .xft-table th{background:#f7f9fb;color:#748298;font-weight:500}#xft-panel .xft-table th:first-child,#xft-panel .xft-table td:first-child{text-align:left;width:22%}#xft-panel .xft-mini{height:6px;background:#e8edf4;border-radius:3px}#xft-panel .xft-mini i{display:block;height:100%;border-radius:3px}#xft-panel .xft-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #dde5ee;padding-bottom:8px;margin-top:20px}#xft-panel .xft-red{color:#bc4747;font-size:11px}#xft-panel .xft-footer{padding:12px ${o.p}px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #dce4ef;font-size:11px;flex:none}#xft-panel .xft-footer div{display:flex;gap:8px;flex-wrap:wrap}
</style><body id="xft-scene"><div class="xft-bg-nav">模拟页面 · 物流追踪</div><div class="xft-bg"><b>已签收 · 页面背景</b><p>平台渠道　全部</p><p>店铺账号　全部</p><p>国家区域　全部</p><p>物流方式　全部</p><p>订单列表（示意）</p></div>${panel(o)}<script>const sets={店铺:['演示店铺一','演示店铺二','演示店铺三'],物流:['iMile','J&T','FedEx'],国家:['墨西哥'],日期:['2026-09-01','2026-09-02','2026-09-03']}; const make=${table.toString()}; function dim(key){document.getElementById('xft-dim').innerHTML=make(['维度','单数','平均(小时)','中位(小时)','P90(小时)','达标占比','单量占比'],sets[key].map((s,i)=>[s,key==='国家'?'130':[50,40,40][i],'120.0','112.0','192.0','80%',key==='国家'?'100%':(i===0?'38.5%':'30.8%')]));}document.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dim]').forEach(t=>t.classList.toggle('xft-active',t===b));dim(b.dataset.dim)});dim('店铺');<\/script></body></html>`;
}
function render(){const grid=document.getElementById('xft-grid');grid.className=focus?'xft-grid xft-focus':'xft-grid';grid.innerHTML='';for(const o of options.filter(o=>!focus||o.id===focus)){const card=document.createElement('section');card.className='xft-card';const actual=Math.min(o.w,size[0]-o.r-72);card.innerHTML=`<div class="xft-cardhead"><h2>${o.id}　${o.name}</h2><p>${o.desc}</p><p class="xft-tag">外框 ${actual}px · 右侧 ${o.r}px · 内容内边距 ${o.p}px × ${o.z} · 文字 ${o.font}px × ${o.z} · 高度80vh</p><button data-open="${o.id}">原尺寸查看 ${o.id}</button></div><div class="xft-stage"><iframe title="候选${o.id}" sandbox="allow-scripts allow-same-origin"></iframe></div>`;grid.appendChild(card);card.querySelector('iframe').srcdoc=doc(o);card.querySelector('button').onclick=()=>{focus=o.id;render();};}resize();document.getElementById('xft-status').textContent=focus?'原尺寸：1个模拟CSS像素 = 当前页面1个CSS像素；不足宽度可横向滚动':'缩略总览：四版使用相同缩略比例';}
function resize(){document.querySelectorAll('.xft-stage').forEach(s=>{const f=s.querySelector('iframe'),scale=focus?1:s.clientWidth/size[0];f.style.width=size[0]+'px';f.style.height=size[1]+'px';f.style.transform=`scale(${scale})`;s.style.height=(size[1]*scale)+'px';});}
document.getElementById('xft-size').onchange=e=>{size=e.target.value.split(',').map(Number);render()};document.getElementById('xft-all').onclick=()=>{focus=null;render()};window.addEventListener('resize',resize);render();
</script></body></html>
